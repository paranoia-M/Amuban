name: Build IGBT Smart Test Platform

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Industrial-Grade Dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装项目运行必须的所有科学计算和UI库
        pip install PyQt6 pyinstaller numpy scipy matplotlib scikit-learn pandas watchdog sqlalchemy

    - name: Build Professional EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile `
        --name "IGBT_Smart_Test_System" `
        --collect-submodules ui `
        --collect-submodules core `
        --hidden-import "ui.acquisition_config" `
        --hidden-import "ui.waveform_monitor" `
        --hidden-import "ui.mutation_analysis" `
        --hidden-import "ui.oscillation_analysis" `
        --hidden-import "ui.mutation_offset" `
        --hidden-import "ui.peak_valley_feature" `
        --hidden-import "ui.trend_analysis" `
        --hidden-import "ui.consistency_check" `
        --hidden-import "ui.quality_evaluator" `
        --hidden-import "ui.fault_diagnostics" `
        --hidden-import "ui.data_center" `
        --hidden-import "ui.automated_pipeline" `
        --hidden-import "ui.patent_report" `
        --hidden-import "ui.login_window" `
        --hidden-import "sklearn.utils._typedefs" `
        --add-data "ui;ui" `
        --add-data "core;core" `
        --add-data "database;database" `
        main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IGBT-Production-Ready-EXE
        path: dist/IGBT_Smart_Test_System.exe
        retention-days: 5