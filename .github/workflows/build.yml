name: Build IT Supervision Platform

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller cryptography pandas

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile `
        --collect-submodules modules `
        --hidden-import "modules.asset_inventory" `
        --hidden-import "modules.performance" `
        --hidden-import "modules.fault_diag" `
        --hidden-import "modules.task_scheduling" `
        --hidden-import "modules.energy_save" `
        --hidden-import "modules.capacity_plan" `
        --hidden-import "modules.topology" `
        --hidden-import "modules.compliance" `
        --hidden-import "modules.cluster_ha" `
        --add-data "modules;modules" `
        --add-data "core;core" `
        --name "IT_Supervision_Platform" `
        main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IT-Supervision-Platform-EXE
        path: dist/IT_Supervision_Platform.exe
        retention-days: 5